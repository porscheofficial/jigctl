[tools]
uv = "0.12.5"
"pipx:check-jsonschema" = "0.38.0"
go = "1.26.6"
"aqua:mvdan/gofumpt" = "0.11.0"
"aqua:golangci/golangci-lint" = "2.12.2"
"go:go.uber.org/nilaway/cmd/nilaway" = "latest"

[tasks.metaschema]
description = "Validate the HCR schema against its own metaschema"
run = "check-jsonschema --check-metaschema schema/hcr.schema.json"

[tasks.corpus]
description = "Run every corpus fixture against the schema and assert its expected verdict"
run = "go test ./internal/hcr/ -race -shuffle=on -count=1 -run TestCorpus -v"

[tasks."expectations:freeze"]
description = "Freeze the corpus expectation digest for deliberate review"
run = "JIGCTL_FREEZE_EXPECTATIONS=1 go test ./internal/hcr/ -run TestExpectationsFrozen -count=1"

[tasks.check]
description = "Everything CI runs, in CI's order"
depends = ["test", "dogfood"]

[tasks.lint]
description = "Run gofumpt, golangci-lint and nilaway over the Go module"
run = "gofumpt -l . && golangci-lint run ./... && nilaway ./..."

[tasks.test]
description = "Run the Go test suite with race detection and shuffled ordering"
run = "go test ./... -race -shuffle=on -count=1"

[tasks.dogfood]
description = "Validate this repo's own .hcr/ records with jigctl"
run = "go run ./cmd/jigctl run . --allow-exec"
